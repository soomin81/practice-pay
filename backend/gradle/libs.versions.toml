[versions]
kotlin = "2.3.21"
springBoot = "4.1.0"
springDependencyManagement = "1.1.7"
ktlint = "14.2.0"
jooqCodegen = "3.20.3"
kotest = "5.9.1"
kotestExtensionsSpring = "1.3.0"
mockk = "1.14.3"
springmockk = "5.0.1"
archunit = "1.4.1"
web3j = "4.14.0"
kotlinLogging = "7.0.7"
restdocsApiSpec = "0.20.1"
poi = "5.4.0"

[libraries]
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
# kotlin("plugin.spring")(id `org.jetbrains.kotlin.plugin.spring`)의 실제 구현체다 —
# kotlin-gradle-plugin 자체에는 이 플러그인 마커가 없다.
kotlin-allopen = { module = "org.jetbrains.kotlin:kotlin-allopen", version.ref = "kotlin" }
springBoot-gradlePlugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "springBoot" }
springDependencyManagement-gradlePlugin = { module = "io.spring.gradle:dependency-management-plugin", version.ref = "springDependencyManagement" }

kotest-runnerJunit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-assertionsCore = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-extensionsSpring = { module = "io.kotest.extensions:kotest-extensions-spring", version.ref = "kotestExtensionsSpring" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
springmockk = { module = "com.ninja-squad:springmockk", version.ref = "springmockk" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
web3j-core = { module = "org.web3j:core", version.ref = "web3j" }
# Apache POI — 결제 내역 .xlsx 내보내기(modules:infra-support의 XlsxPaymentExportWriter).
# poi-ooxml이 xlsx(OOXML)를 담당하고 코어 poi를 전이로 끌고 온다.
poi-ooxml = { module = "org.apache.poi:poi-ooxml", version.ref = "poi" }
kotlinLogging-jvm = { module = "io.github.oshai:kotlin-logging-jvm", version.ref = "kotlinLogging" }

# Spring Boot BOM이 버전을 관리하는 좌표라 version이 없다.
jackson-moduleKotlin = { module = "tools.jackson.module:jackson-module-kotlin" }
mysql-connectorJ = { module = "com.mysql:mysql-connector-j" }
junitPlatform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

# Spring REST Docs 스니펫에 OpenAPI 메타데이터를 얹는다(spring-restdocs 자체는 Boot BOM이 관리).
restdocsApiSpec-mockmvc = { module = "com.epages:restdocs-api-spec-mockmvc", version.ref = "restdocsApiSpec" }
springBoot-starterRestdocs = { module = "org.springframework.boot:spring-boot-starter-restdocs" }
# starter는 spring-restdocs-core만 가져오고, restdocs-api-spec-mockmvc는 이걸 runtime
# scope로만 선언한다 — 컴파일 시점에 RestDocumentationResultHandler를 못 봐서 명시한다.
springRestdocs-mockmvc = { module = "org.springframework.restdocs:spring-restdocs-mockmvc" }

[plugins]
jooq-codegen = { id = "org.jooq.jooq-codegen-gradle", version.ref = "jooqCodegen" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
restdocs-apiSpec = { id = "com.epages.restdocs-api-spec", version.ref = "restdocsApiSpec" }
# 루트 build.gradle.kts가 `apply false`로만 쓴다(자기 Kotlin 소스는 없다) —
# 서브프로젝트는 build-logic의 practicepay.kotlin-common을 통해 같은 버전을 받는다.
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
