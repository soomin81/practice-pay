# Gradle 빌드 설정.
#
# `backend/`가 Gradle 빌드 루트라서 여기에 둔다(`build-logic`은 포함된 빌드지만
# 자체 gradle.properties 없이 이 데몬 설정을 공유한다).
#
# 지금까지 이 파일이 아예 없어서 Gradle 기본값으로만 빌드했다 — 서브프로젝트가 11개인
# 이 저장소에서는 아래 세 옵션의 효과가 크다.

# 서로 의존하지 않는 서브프로젝트를 병렬로 빌드한다.
org.gradle.parallel=true

# 태스크 출력을 재사용한다(로컬 빌드 캐시).
org.gradle.caching=true

# Configuration Cache. Gradle 9가 매 빌드마다 권하던 옵션이고, 켜기 전에 이 프로젝트의
# 플러그인 조합에서 실제로 저장·재사용되는지 확인했다 — `build`(ktlint/Kotest/Spring Boot),
# `:db-core:jooqCodegen`(jOOQ Codegen 플러그인), `:apps:*:bootRun` 셋 다 "Configuration
# cache entry reused"까지 정상이었다.
#
# 새 플러그인을 도입한 뒤 여기서 문제가 생기면 `--no-configuration-cache`로 우회하고,
# 그 플러그인이 Configuration Cache를 지원하는지부터 확인한다.
org.gradle.configuration-cache=true

# 한글 KDoc·마이그레이션 주석이 플랫폼 기본 인코딩에 좌우되지 않도록 UTF-8을 고정한다
# (`mysql` CLI에 `--default-character-set=utf8mb4`를 넘기는 것과 같은 이유 —
# backend/CLAUDE.md의 "Database / jOOQ 코드 생성" 절 참고).
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
