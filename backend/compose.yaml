services:
  mysql:
    image: 'mysql:latest'
    environment:
      - 'MYSQL_DATABASE=stablecoin_payment'
      - 'MYSQL_PASSWORD=secret'
      - 'MYSQL_ROOT_PASSWORD=verysecret'
      - 'MYSQL_USER=myuser'
    ports:
      - '3306:3306'

  # 앱 없이 Flyway를 돌리기 위한 도구 서비스다 — `docker compose run --rm flyway migrate`.
  #
  # 앱을 띄우면 스키마는 자동 적용되지만(spring-boot-starter-flyway), jOOQ 코드
  # 생성이 테이블을 먼저 필요로 하고 앱 빌드는 그 생성 결과에 의존해서, 최초 1회는
  # 앱 없이 적용해야 순환에 빠지지 않는다(backend/CLAUDE.md의 "Flyway" 절 참고).
  #
  # `profiles`가 붙어 있어 `docker compose up -d`로는 뜨지 않는다(1회성 도구이지
  # 상시 실행 서비스가 아니다). compose가 상대 경로와 네트워크를 처리해줘서
  # `docker run`을 직접 쓸 때와 달리 셸/OS에 따라 경로 문법을 바꿀 필요가 없다.
  #
  # 마운트 대상은 db/migration뿐이다 — 개발용 시드(db/seed)는 Flyway가 관리하지
  # 않는다(운영에서 자동 제외되도록 분리했다, backend/CLAUDE.md의 "시드 데이터" 참고).
  flyway:
    image: 'flyway/flyway:latest'
    profiles: ['tools']
    depends_on:
      - mysql
    environment:
      - 'FLYWAY_URL=jdbc:mysql://mysql:3306/stablecoin_payment'
      - 'FLYWAY_USER=root'
      - 'FLYWAY_PASSWORD=verysecret'
      - 'FLYWAY_CONNECT_RETRIES=10'
    volumes:
      - './db-core/src/main/resources/db/migration:/flyway/sql'
