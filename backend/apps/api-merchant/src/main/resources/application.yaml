spring:
  application:
    name: api-merchant
  datasource:
    # 기본값은 로컬 개발용(compose.yaml의 MySQL)이고, 운영에서는 아래 환경변수로
    # 덮어쓴다 — Pepper 설정과 같은 규칙이다(backend/CLAUDE.md의 "설정과 비밀값" 절).
    #
    # allowPublicKeyRetrieval=true는 로컬 개발 기본값 전용이다 — MySQL 9의
    # caching_sha2_password가 새 볼륨의 첫 접속에서 RSA 공개키 교환을 요구해서
    # 이 옵션이 없으면 연결이 실패한다. 자세한 배경은 apps/api-payment의
    # application.yaml에 있는 같은 자리 주석 참고(운영에서는 TLS를 쓴다).
    url: "${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/stablecoin_payment?useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}"
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:verysecret}

server:
  port: 8083

app:
  invitation-token:
    # 기본값은 로컬 개발용 평문 placeholder다 — 운영에서는 APP_INVITATION_TOKEN_PEPPER
    # 환경변수로 덮어쓴다(Secret Manager가 주입). 값을 여기 직접 적지 않는다.
    #
    # `${...}` 문법이 환경변수 덮어쓰기를 "가능하게" 하는 건 아니다 — Spring Boot가
    # 환경변수를 application.yaml보다 우선해서 읽고 이름을 자동 매핑한다(relaxed
    # binding). 여기 명시하는 건 환경변수 이름을 설정 파일만 보고 알 수 있게 하려는 것이다.
    #
    # !! 이 값은 api-admin의 같은 설정과 반드시 일치해야 한다 !!
    # 이 앱은 가맹점 사용자 초대를 "수락"만 하고, 그 초대를 "발급"하는 쪽은
    # 다른 앱이다(향후 가맹점 등록 시 최초 OWNER 초대). 발급 때 쓴 Pepper와
    # 수락 때 쓰는 Pepper가 다르면 token_hash가 달라져 초대를 찾지 못한다 —
    # 자세한 배경은 api-admin/application.yaml의 같은 자리 주석 참고.
    pepper: ${APP_INVITATION_TOKEN_PEPPER:dev-only-invitation-token-pepper-change-in-production}
  api-key:
    # 기본값은 로컬 개발용 평문 placeholder다 — 운영에서는 APP_API_KEY_PEPPER
    # 환경변수로 덮어쓴다(Secret Manager가 주입). 값을 여기 직접 적지 않는다.
    #
    # !! 이 값은 api-payment의 같은 설정과 반드시 일치해야 한다 !!
    # 이 앱은 API Key를 "발급"만 하고(secretHash = hash(rawApiKey)), 그 Key로
    # 실제 결제 API를 호출할 때 "검증"하는 쪽은 api-payment다(matches(rawApiKey,
    # secretHash)). 두 앱의 Pepper가 다르면 같은 rawApiKey로 계산한 해시가 서로
    # 달라져, 방금 발급한 Key로 결제 API를 호출해도 곧바로 401이 난다 — 자세한
    # 배경은 api-payment/application.yaml의 같은 자리 주석 참고.
    pepper: ${APP_API_KEY_PEPPER:dev-only-api-key-pepper-change-in-production}
