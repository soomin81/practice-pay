spring:
  application:
    name: api-admin
  datasource:
    # 기본값은 로컬 개발용(compose.yaml의 MySQL)이고, 운영에서는 아래 환경변수로
    # 덮어쓴다 — Pepper 설정과 같은 규칙이다(backend/CLAUDE.md의 "설정과 비밀값" 절).
    #
    # allowPublicKeyRetrieval=true는 로컬 개발 기본값 전용이다 — MySQL 9의
    # caching_sha2_password가 새 볼륨의 첫 접속에서 RSA 공개키 교환을 요구해서
    # 이 옵션이 없으면 연결이 실패한다. 자세한 배경은 apps/api-payment의
    # application.yaml에 있는 같은 자리 주석 참고(운영에서는 TLS를 쓴다).
    url: "${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/stablecoin_payment?useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}"
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:verysecret}

server:
  port: 8082

app:
  admin-console:
    # 내부 운영자 콘솔(브라우저 SPA)만을 위한 CORS 허용 Origin이다. 세션 쿠키를 교차
    # 출처로 실어 보내므로 SecurityConfig가 allowCredentials=true로 열고, 그 제약상
    # 여기에 와일드카드를 쓸 수 없다 — 정확한 Origin만 나열한다. 기본값은 로컬
    # 프론트엔드 개발 서버(frontend/admin, 포트 5175)를 가리키고, 운영에서는
    # APP_ADMIN_CONSOLE_ALLOWED_ORIGINS로 덮어쓴다(쉼표로 구분).
    allowed-origins: ${APP_ADMIN_CONSOLE_ALLOWED_ORIGINS:http://localhost:5175}
  invitation-token:
    # 기본값은 로컬 개발용 평문 placeholder다 — 운영에서는 APP_INVITATION_TOKEN_PEPPER
    # 환경변수로 덮어쓴다(Secret Manager가 주입). 값을 여기 직접 적지 않는다.
    #
    # `${...}` 문법이 환경변수 덮어쓰기를 "가능하게" 하는 건 아니다 — Spring Boot는
    # 환경변수를 application.yaml보다 우선하는 property source로 이미 읽고,
    # APP_INVITATION_TOKEN_PEPPER를 app.invitation-token.pepper로 자동 매핑한다
    # (relaxed binding). 여기 명시하는 건 "이 값은 주입받는 것"이라는 사실과
    # 정확한 환경변수 이름을 설정 파일만 보고 알 수 있게 하기 위해서다.
    #
    # !! 이 값은 api-merchant의 같은 설정과 반드시 일치해야 한다 !!
    # 초대는 발급 시점에 hash(원문 Token)을 account_invitation.token_hash에 저장하고,
    # 수락 시점에 다시 hash(원문 Token)으로 조회한다(AcceptAccountInvitationUseCase).
    # 두 앱의 Pepper가 다르면 해시가 달라져 초대를 영영 찾지 못하는데, 그때 나오는
    # 예외는 원인을 숨기는 InvalidInvitationException("유효하지 않은 초대")이라
    # 원인 추적이 매우 어렵다. 발급(api-admin: 내부 사용자/향후 가맹점 등록)과
    # 수락(api-merchant: 가맹점 사용자)이 서로 다른 앱에서 일어나기 때문에
    # 생기는 제약이다 — 한쪽만 교체하지 않는다.
    pepper: ${APP_INVITATION_TOKEN_PEPPER:dev-only-invitation-token-pepper-change-in-production}
