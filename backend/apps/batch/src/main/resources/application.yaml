spring:
  application:
    name: batch
  datasource:
    # 기본값은 로컬 개발용(compose.yaml의 MySQL)이고, 운영에서는 아래 환경변수로
    # 덮어쓴다 — Pepper 설정과 같은 규칙이다(backend/CLAUDE.md의 "설정과 비밀값" 절).
    #
    # allowPublicKeyRetrieval=true는 로컬 개발 기본값 전용이다 — MySQL 9의
    # caching_sha2_password가 새 볼륨의 첫 접속에서 RSA 공개키 교환을 요구해서
    # 이 옵션이 없으면 연결이 실패한다. 자세한 배경은 apps/api-payment의
    # application.yaml에 있는 같은 자리 주석 참고(운영에서는 TLS를 쓴다).
    url: "${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/stablecoin_payment?useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}"
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:verysecret}
  batch:
    # JobLauncherApplicationRunner가 부팅 시 자동으로 한 번 실행하는 기본 동작을
    # 끈다 — 이 Job은 BlockchainTransactionConfirmScheduler가 주기적으로 직접
    # 실행한다(JobOperator.start). 스키마는 Flyway 마이그레이션(V5)이 관리하므로
    # jdbc.initialize-schema도 명시적으로 끈다("Migration → MySQL Schema → jOOQ
    # Code Generation" 원칙, 프레임워크의 자동 스키마 생성에 맡기지 않는다).
    job:
      enabled: false
    jdbc:
      initialize-schema: never

app:
  blockchain:
    base-sepolia:
      # 기본값은 Base Sepolia 공개 RPC다 — 운영에서는 APP_BLOCKCHAIN_BASE_SEPOLIA_RPC_URL
      # 환경변수로 전용 RPC 프로바이더(Alchemy/Infura 등)를 주입한다. 공개 RPC는
      # 요청 제한·안정성 문제로 운영에 그대로 쓰지 않는다.
      #
      # 전용 프로바이더 URL은 대개 API Key를 경로에 포함하므로(비밀값) 여기 직접
      # 적지 않는다 — Pepper와 같은 취급이다(backend/CLAUDE.md의 "설정과 비밀값" 절).
      rpc-url: ${APP_BLOCKCHAIN_BASE_SEPOLIA_RPC_URL:https://sepolia.base.org}
