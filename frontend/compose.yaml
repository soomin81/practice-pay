# 프론트엔드 개발 서버를 Docker로 돌린다 — 이 머신에는 호스트 Node가 없고
# node:24-alpine 이미지만 있다.
#
# 백엔드(backend/compose.yaml)와 파일을 나눠 둔 이유는 생명주기가 다르기 때문이다.
# 백엔드 MySQL은 상시 떠 있고, 프론트 개발 서버는 프론트 작업할 때만 띄운다.
#
#   docker compose up          # http://localhost:5173
#   docker compose run --rm payment npm install <pkg>
services:
  payment:
    image: node:24-alpine
    working_dir: /app
    ports:
      # 5173은 api-payment의 CORS 허용 목록(app.checkout.allowed-origins)에
      # 이미 들어 있는 포트다 — 바꾸면 그쪽 설정도 함께 바꿔야 한다.
      - "5173:5173"
    volumes:
      - ./payment:/app
      # node_modules를 별도 볼륨으로 덮는 것이 핵심이다. 이게 없으면 Windows
      # 호스트의 node_modules가 컨테이너 안을 가리게 되는데, esbuild/rollup 같은
      # 네이티브 바이너리는 플랫폼별로 다르다 — Windows 바이너리를 Linux
      # 컨테이너에서 실행하려다 실패한다.
      #
      # 익명 볼륨(`- /app/node_modules`)이 아니라 **이름 있는 볼륨**을 쓴다.
      # 익명이면 `docker compose run`이 매번 새 볼륨을 만들어서, 그 안에서 한
      # npm install 결과가 다음 명령에 남지 않는다.
      - payment-node-modules:/app/node_modules
      # 백엔드가 생성한 OpenAPI 스펙을 읽기 전용으로 들여온다(npm run gen:api).
      # 스펙은 커밋 대상이 아니라 build/ 아래 생성물이라, 먼저
      # `cd backend && gradlew.bat :apps:api-payment:openapi3`를 돌려야 채워진다.
      - ../backend/apps/api-payment/build/api-spec:/spec:ro
    environment:
      # Docker Desktop의 Windows 바인드 마운트는 inotify 이벤트를 컨테이너로
      # 전달하지 않는다. 폴링을 켜지 않으면 파일을 고쳐도 HMR이 반응하지 않는다.
      - CHOKIDAR_USEPOLLING=true
    # --host 0.0.0.0 이 없으면 Vite가 컨테이너 내부 localhost에만 바인딩해서
    # 호스트 브라우저에서 접속되지 않는다(포트를 매핑해도 마찬가지다).
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  # OpenAPI 스펙 → TypeScript 타입 생성. 1회성 도구라 `profiles`를 붙여서
  # `docker compose up`으로는 뜨지 않는다(backend/compose.yaml의 flyway와 같은 패턴).
  #
  #   docker compose run --rm gen-api
  #
  # **payment 서비스와 node_modules를 공유하지 않는 것이 핵심이다.**
  # openapi-typescript@7이 peer로 typescript@^5를 요구하는데 이 앱은 TypeScript 6을
  # 쓴다. --force로 섞으면 그 도구가 TS 컴파일러 API를 쓰기 때문에 조용히 잘못된
  # 결과를 낼 수 있다. npx로 격리 실행하면 앱의 TS 버전과 무관해지고, 생성물은
  # 평범한 .d.ts 텍스트라 TS 6에서 그대로 쓸 수 있다.
  gen-api:
    image: node:24-alpine
    profiles: ['tools']
    working_dir: /app
    volumes:
      - ./payment:/app
      - ../backend/apps/api-payment/build/api-spec:/spec:ro
    command: >
      sh -c "test -f /spec/openapi3.yaml
      || (echo '스펙이 없다. 먼저 backend에서 gradlew.bat :apps:api-payment:openapi3 를 실행한다.' && exit 1);
      npx -y openapi-typescript@7 /spec/openapi3.yaml -o /app/src/api/schema.d.ts"

volumes:
  payment-node-modules:
